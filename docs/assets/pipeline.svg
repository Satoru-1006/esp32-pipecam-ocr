<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">PipeCam system architecture</title>
  <desc id="desc">ESP32-S3 camera firmware sends an MJPEG stream to a Qt or Python host, which runs local OCR and posts result state back to the device.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="violet" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f0abfc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1400" height="560" rx="30" fill="url(#bg)"/>
  <text x="70" y="78" fill="#e2e8f0" font-family="Inter,Segoe UI,sans-serif" font-size="30" font-weight="700">PipeCam / evidence-bounded data path</text>
  <text x="70" y="112" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="16">Capture → transport → recognition → state feedback</text>
  <g filter="url(#shadow)">
    <rect x="70" y="170" width="280" height="220" rx="20" fill="#0f2430" stroke="#22d3ee" stroke-width="2"/>
    <rect x="420" y="170" width="280" height="220" rx="20" fill="#171d38" stroke="#818cf8" stroke-width="2"/>
    <rect x="770" y="170" width="280" height="220" rx="20" fill="#20152f" stroke="#d8b4fe" stroke-width="2"/>
    <rect x="1120" y="170" width="210" height="220" rx="20" fill="#162a24" stroke="#34d399" stroke-width="2"/>
  </g>
  <g fill="#e2e8f0" font-family="Inter,Segoe UI,sans-serif">
    <text x="105" y="220" font-size="22" font-weight="700">ESP32-S3</text>
    <text x="105" y="253" font-size="16" fill="#a5f3fc">UVC capture</text>
    <text x="105" y="280" font-size="16" fill="#a5f3fc">Wi-Fi AP</text>
    <text x="105" y="307" font-size="16" fill="#a5f3fc">LCD + keys + light</text>
    <text x="105" y="350" font-size="14" fill="#94a3b8">main.c</text>
    <text x="455" y="220" font-size="22" font-weight="700">Transport</text>
    <text x="455" y="253" font-size="16" fill="#c7d2fe">MJPEG :8080</text>
    <text x="455" y="280" font-size="16" fill="#c7d2fe">JSON :8081</text>
    <text x="455" y="307" font-size="16" fill="#c7d2fe">status / control / result</text>
    <text x="455" y="350" font-size="14" fill="#94a3b8">HTTP endpoints</text>
    <text x="805" y="220" font-size="22" font-weight="700">Host inference</text>
    <text x="805" y="253" font-size="16" fill="#f5d0fe">Qt/C++ or PySide6</text>
    <text x="805" y="280" font-size="16" fill="#f5d0fe">OpenCV decode</text>
    <text x="805" y="307" font-size="16" fill="#f5d0fe">local PaddleOCR</text>
    <text x="805" y="350" font-size="14" fill="#94a3b8">records + evidence</text>
    <text x="1150" y="220" font-size="22" font-weight="700">Feedback</text>
    <text x="1150" y="253" font-size="16" fill="#a7f3d0">idle</text>
    <text x="1150" y="280" font-size="16" fill="#a7f3d0">processing</text>
    <text x="1150" y="307" font-size="16" fill="#a7f3d0">pass / fail</text>
    <text x="1150" y="350" font-size="14" fill="#94a3b8">LCD / buzzer / light</text>
  </g>
  <path d="M350 280 H410" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M700 280 H760" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1050 280 H1110" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1260 410 C1260 490 200 490 200 410" fill="none" stroke="url(#cyan)" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)"/>
  <text x="550" y="470" fill="#67e8f9" font-family="Inter,Segoe UI,sans-serif" font-size="15">host posts recognition state back to the device</text>
</svg>
